    </svg>

}

// ── QR placeholder ───────────────────────────────────────────
function QR({ size=160 }) {
  const N = 21, cell = size/N;
  const cells = useMemo(() => {
    const arr = []; let seed = 7;
    for (let r=0; r<N; r++) for (let c=0; c<N; c++) {
      seed = (seed*9301+49297)%233280;
      if (seed/233280 > 0.52) arr.push([r,c]);
    }
    return arr;
  }, []);
  const finder = (x,y) => (
    <g key={`f${x}${y}`}>
      <rect x={x*cell} y={y*cell} width={7*cell} height={7*cell} fill="#0A0A0A"/>
      <rect x={(x+1)*cell} y={(y+1)*cell} width={5*cell} height={5*cell} fill="#fff"/>
      <rect x={(x+2)*cell} y={(y+2)*cell} width={3*cell} height={3*cell} fill="#0A0A0A"/>
    </g>
  );
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{display:'block'}}>
      <rect width={size} height={size} fill="#fff"/>
      {cells.map(([r,c],i) => {
        if ((r<8&&c<8)||(r<8&&c>=N-8)||(r>=N-8&&c<8)) return null;
        return <rect key={i} x={c*cell} y={r*cell} width={cell} height={cell} fill="#0A0A0A"/>;
      })}
      {finder(0,0)}{finder(N-7,0)}{finder(0,N-7)}
    </svg>
  );
}

function TimerArc({ size=220, progress=0.7 }) {
  const stroke=4, r=(size-stroke)/2, C=2*Math.PI*r;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}
      style={{position:'absolute',inset:0,pointerEvents:'none'}}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="rgba(0,113,206,0.12)" strokeWidth={stroke}/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={VERIS.blue} strokeWidth={stroke}
        strokeDasharray={C} strokeDashoffset={C*(1-progress)} strokeLinecap="round"
        transform={`rotate(-90 ${size/2} ${size/2})`} style={{transition:'stroke-dashoffset 0.9s linear'}}/>
    </svg>
  );
}

}

// ── Main App ──────────────────────────────────────────────────
function App() {
  const [scene, setScene] = useState(0); // 0=stack, 1=expanded, 2=detail
  const [secs, setSecs] = useState(30);

  useEffect(() => {
    if (scene !== 2) { setSecs(30); return; }
    const id = setInterval(() => setSecs(s => s <= 1 ? 30 : s-1), 1000);
    return () => clearInterval(id);
  }, [scene]);

  return (
    <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:32, width:'100%' }}>
      {/* Title */}
      <div style={{ textAlign:'center' }}>
        <div style={{ fontSize:13, fontWeight:700, letterSpacing:2, color:'rgba(60,50,40,0.5)',
          textTransform:'uppercase', marginBottom:8, fontFamily:F }}>Veris Centrales Médicas</div>
        <h1 style={{ fontSize:28, fontWeight:800, color:'rgba(40,30,20,0.85)', fontFamily:F, marginBottom:4 }}>
          Tarjeta de Fidelización Digital
        </h1>
        <p style={{ fontSize:13, color:'rgba(60,50,40,0.55)', fontFamily:F }}>
          Prototipo interactivo · Toca la tarjeta Veris azul para navegar
        </p>
      </div>

      {/* State tabs */}
      <div style={{ display:'flex', background:'rgba(0,0,0,0.06)', borderRadius:12, padding:4, gap:2, fontFamily:F }}>
        {[['① Stack','Colapsada'],['② Tarjeta','Expandida'],['③ QR','Detalle']].map(([label, sub], i) => (
          <button key={i} onClick={() => setScene(i)} style={{
            all:'unset', cursor:'pointer', padding:'8px 16px', borderRadius:9,
            background: scene===i ? '#fff' : 'transparent',
            boxShadow: scene===i ? '0 1px 4px rgba(0,0,0,0.1)' : 'none',
            transition:'all 0.15s',
          }}>
            <div style={{ fontSize:13, fontWeight:600, color: scene===i ? VERIS.blue : 'rgba(60,50,40,0.6)' }}>{label}</div>
            <div style={{ fontSize:10, color:'rgba(60,50,40,0.45)', marginTop:1 }}>{sub}</div>
          </button>
        ))}
      </div>

      {/* Phone */}
      <Phone>
        {/* Stack */}
        <div style={{ position:'absolute', inset:0, opacity:scene===0?1:0,
          pointerEvents:scene===0?'auto':'none', transition:'opacity 250ms ease' }}>
          <WalletStack onTapVeris={() => setScene(1)}/>
        </div>
        {/* Expanded */}
        <div style={{ position:'absolute', inset:0, opacity:scene===1?1:0,
          pointerEvents:scene===1?'auto':'none', transition:'opacity 250ms ease' }}>
          <ExpandedScene onBack={() => setScene(0)} onDetail={() => setScene(2)}/>
        </div>
        {/* Detail */}
        <div style={{ position:'absolute', inset:0, opacity:scene===2?1:0,
          pointerEvents:scene===2?'auto':'none',
          transition:'opacity 250ms ease, transform 250ms ease',
          transform: scene===2 ? 'translateY(0)' : 'translateY(20px)' }}>
          <CardDetail onBack={() => setScene(1)} timerProgress={secs/30} secondsLeft={secs}/>
        </div>
      </Phone>

      <p style={{ fontSize:11, color:'rgba(60,50,40,0.4)', fontFamily:F, textAlign:'center', maxWidth:300 }}>
        Este es el aspecto visual de tu tarjeta de fidelización en Google Wallet
      </p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
